name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is taken from package.json "packageManager" field

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm -F @app/db exec prisma generate

      - name: Build all
        run: |
          pnpm -F @app/shared build
          pnpm -F @app/db build
          pnpm -F web build
          pnpm -F worker build

      - name: Install Playwright Chromium (bundled path)
        shell: bash
        env:
          # Absolute path so `pnpm -F worker exec` (which cd's into apps/worker)
          # doesn't resolve this relative and end up with apps/worker/apps/worker/...
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/apps/worker/ms-playwright
        run: pnpm -F worker exec playwright install chromium

      - name: Stage resources for electron-builder
        run: node apps/desktop/scripts/stage-resources.mjs

      - name: Build + publish Electron app
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder picks up GH_TOKEN to upload to Releases
        # Compile TypeScript first (produces dist/main.js — required by electron-builder)
        run: pnpm build && pnpm exec electron-builder --publish always
