appId: com.phantakanxm.fbgroupautopost
productName: FB Group Autopost
directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../../apps/web/.next/standalone
    to: app-web
    filter: ["**/*"]
  - from: .staged/app-worker
    to: app-worker
    filter: ["**/*"]
  - from: .staged/app-db
    to: app-db
    filter: ["**/*"]

mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.productivity
  icon: assets/icon.png

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.png

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Network
  icon: assets/icon.png

publish:
  provider: github
  owner: phantakanxm
  repo: facebook-group-autopost
  releaseType: release
